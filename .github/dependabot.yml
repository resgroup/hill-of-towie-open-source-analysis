version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      # uv.lock pins the full transitive tree, but we only want PRs for
      # packages we actually declare in pyproject.toml.
      - dependency-type: "direct"
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # major bumps intentionally left ungrouped -> one PR each for review

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
